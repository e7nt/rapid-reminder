# Natural-language reminder fixtures.
#
# Each entry is one of:
#   - a success case with `expected: { offset_seconds, message, time_span, confidence }`
#   - an error case with `error: <snake_case ParseError name>`
#
# `now` is an RFC 3339 timestamp; assertions compare a duration, so its zone is
# irrelevant. `time_span` is the exact substring the parser marked as the time,
# preserving the user's original casing.
#
# This corpus is meant to grow. Group new phrases under a commented category so
# contributors can see what each block is exercising.

# ── Bare relative time: minutes ───────────────────────────────────────────────
- input: "in 15 mins check build"
  now: "2026-07-04T12:00:00+05:30"
  expected: { offset_seconds: 900, message: "check build", time_span: "15 mins", confidence: "high" }

