# Natural-language reminder fixtures.
#
# Each entry is one of:
#   - a success case with `expected: { offset_seconds, message, time_span, confidence }`
#   - an error case with `error: <snake_case ParseError name>`
#
# Relative fixtures use `now` (an RFC 3339 instant) and assert `offset_seconds`,
# which is timezone-invariant. Absolute fixtures use `now_local`
# (`YYYY-MM-DD HH:MM` local wall clock) and assert `due_local`, so times like
# `5pm` resolve deterministically regardless of the machine's timezone.
# `time_span` is the exact substring the parser marked as the time, preserving
# the user's original casing.
#
# This corpus is meant to grow. Group new phrases under a commented category so
# contributors can see what each block is exercising.

