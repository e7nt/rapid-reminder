[package]
name = "rapid-reminder"
version = "0.1.0"
edition = "2024"
description = "Set reliable reminders from messy human text without breaking terminal flow."
authors = ["The Rapid Reminder authors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/e7nt/rapid-reminder"
homepage = "https://github.com/e7nt/rapid-reminder"
keywords = ["reminder", "cli", "terminal", "notification", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
notify-rust = "4.18.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
signal-hook = "0.4.4"
thiserror = "2.0.18"

[dev-dependencies]
insta = "1.48.0"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
